# Action-text catalog — EDM profile.
#
# Vocabulary leans on structural / DSP language: pulse, kick, sub, low end,
# transients, build, breakdown. Avoids subjective "feels" claims and any
# anticipatory phrasing (no "about to drop", "coming up", "next").

drift_tempo:
  - { prefix: "^^^", text: "the pulse just shifted off the grid" }
  - { prefix: "***", text: "the BPM moved" }
  - { prefix: "...", text: "the tempo wandered" }
  - { prefix: "^^^", text: "the four-on-the-floor stepped sideways" }

drift_dynamic_envelope:
  - { prefix: ">>>", text: "the level climbed" }
  - { prefix: "...", text: "the floor opened up" }
  - { prefix: "^^^", text: "the kick stepped back" }
  - { prefix: ">>>", text: "more weight in the low end now" }

drift_lufs_integrated:
  - { prefix: "^^^", text: "loudness ceiling shifted" }
  - { prefix: "...", text: "the body of the mix changed" }
  - { prefix: ">>>", text: "the mix sat louder" }

